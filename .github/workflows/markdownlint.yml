name: Markdownlint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install markdownlint-cli2
        run: npm install --no-save --ignore-scripts markdownlint-cli2@0.23.2

      - name: Run markdownlint-cli2
        run: npx --no-install markdownlint-cli2 --config .markdownlint.yaml "docs/**/*.md"
