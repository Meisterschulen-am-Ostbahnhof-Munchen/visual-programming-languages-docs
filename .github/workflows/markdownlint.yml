name: Markdownlint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.2 --config .markdownlint.yaml "docs/**/*.md"
