# .markdownlint.yml - Konfigurationsdatei für MarkdownLint

# Basis: markdownlint's "relaxed" Preset, außer first-line-h1 (bleibt aktiv,
# da sinnvoll und mit überschaubarer Trefferzahl). Alle Regeln an, außer den
# unten genannten Layout-Regeln, die bei einer großen, historisch gewachsenen
# Doku zu viel Rauschen ohne inhaltlichen Nutzen erzeugen.
default: true
whitespace: false
line_length: false
ul-indent: false
no-inline-html: false
no-bare-urls: false
fenced-code-language: false

# MD043/required-headings prüft eine exakte, wortwörtliche Heading-Text-
# Struktur pro Datei (z.B. für ein Blog-Template) - nicht die Verschachtelung
# von Heading-Ebenen. Für diese heterogene Doku ist das nicht anwendbar.
# Falsche Verschachtelung (z.B. # gefolgt von ### ohne ##) erkennt stattdessen
# MD001/heading-increment, das über "default: true" aktiv bleibt.
MD043: false

# MD060/table-column-style and MD035/hr-style are pure layout/whitespace
# conventions (pipe alignment in tables, horizontal-rule character choice)
# with no effect on rendering - same "noise without content value" category
# as the whitespace/layout rules already disabled above. Found to fire
# thousands of times across the pre-existing docs when adding the UNGATED
# adapter FB family docs.
MD060: false
MD035: false

# MD036/no-emphasis-as-heading fires on the many italic "(no image
# available)"/"(Bild nicht verfügbar)" placeholder captions used throughout
# the docs (dozens of distinct wordings, DE and EN, for missing FB/exercise/
# datatype images) - these are intentional inline captions, not headings
# masquerading as emphasis, so the rule is pure noise here.
MD036: false
