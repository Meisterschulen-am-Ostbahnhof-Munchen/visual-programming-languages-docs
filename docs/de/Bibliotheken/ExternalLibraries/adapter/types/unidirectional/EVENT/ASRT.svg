    <polygon points="93.5,51.0 98.5,56.0 93.5,61.0" fill="#63B31F"/>
    <text x="90.5" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">TOGGLE</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 23.3740234375 77.0
