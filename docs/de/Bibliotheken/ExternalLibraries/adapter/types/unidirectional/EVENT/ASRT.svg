    <text x="125" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Reset / Switch off</text>

    <text x="125" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
