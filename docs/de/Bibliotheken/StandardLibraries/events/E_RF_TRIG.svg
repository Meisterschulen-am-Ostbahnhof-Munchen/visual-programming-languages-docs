<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 816.34765625 132.0"
     width="816.34765625" height="132.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(331.1875, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 122.740234375 0
            A 3 3 0 0 1 125.740234375 3
            L 125.740234375 43.0
            A 3 3 0 0 1 122.740234375 46.0
            L 115.740234375 46.0
            L 115.740234375 86.0
            L 122.740234375 86.0
            A 3 3 0 0 1 125.740234375 89.0
            L 125.740234375 109.0
            A 3 3 0 0 1 122.740234375 112.0
            L 3 112.0
            A 3 3 0 0 1 0 109.0
            L 0 89.0
            A 3 3 0 0 1 3 86.0
            L 10 86.0
            L 10 46.0
            L 3 46.0
            A 3 3 0 0 1 0 43.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">EI</text>

    <polygon points="119.240234375,11.0 124.240234375,16.0 119.240234375,21.0" fill="#63B31F"/>
    <text x="116.240234375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">ER</text>

    <polygon points="119.240234375,31.0 124.240234375,36.0 119.240234375,41.0" fill="#63B31F"/>
    <text x="116.240234375" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">EF</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 21.0 57.0
            L 37.0 57.0
            A 1 1 0 0 1 38.0 58.0
            L 38.0 61.5
            L 36.0 61.5
            L 36.0 64.5
            L 38.0 64.5
            L 38.0 74.0
            A 1 1 0 0 1 37.0 75.0
            L 21.0 75.0
            A 1 1 0 0 1 20.0 74.0
            L 20.0 64.5
            L 22.0 64.5
            L 22.0 61.5
            L 20.0 61.5
            L 20.0 58.0
            A 1 1 0 0 1 21.0 57.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="29.0" y="71.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">C</text>

    <!-- Block Name -->
    <text x="43.0" y="71.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">E_RF_TRIG</text>

    <text x="62.8701171875" y="86.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">1.0</text>

    <!-- Data Ports -->

    <polygon points="1.5,91.0 6.5,96.0 1.5,101.0" fill="#A3B08F"/>
    <text x="9.5" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">QI</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="-15" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="-15" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="-10.0" y1="16.0" x2="-10.0" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="0" y1="16.0" x2="-20" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="0" y1="96.0" x2="-20" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">check for rising or falling edge – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="150.740234375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – confirmation that a rising edge was detected</text>

    <text x="150.740234375" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – confirmation that a falling edge was detected</text>

    <text x="-25" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">value to check for a rising or falling edge – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">BOOL</tspan></text>
  </g>
