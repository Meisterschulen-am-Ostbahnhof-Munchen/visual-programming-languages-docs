<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 490.1611328125 132.0"
     width="490.1611328125" height="132.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(173.3662109375, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 97 0
            A 3 3 0 0 1 100 3
            L 100 43.0
            A 3 3 0 0 1 97 46.0
            L 90 46.0
            L 90 86.0
            L 97 86.0
            A 3 3 0 0 1 100 89.0
            L 100 109.0
            A 3 3 0 0 1 97 112.0
            L 3 112.0
            A 3 3 0 0 1 0 109.0
            L 0 89.0
            A 3 3 0 0 1 3 86.0
            L 10 86.0
            L 10 46.0
            L 3 46.0
            A 3 3 0 0 1 0 43.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">R</text>

    <polygon points="1.5,31.0 6.5,36.0 1.5,41.0" fill="#63B31F"/>
    <text x="9.5" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">S</text>

    <polygon points="93.5,11.0 98.5,16.0 93.5,21.0" fill="#63B31F"/>
    <text x="90.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">EO</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 24.146484375 57.0
            L 40.146484375 57.0
            A 1 1 0 0 1 41.146484375 58.0
            L 41.146484375 61.5
            L 39.146484375 61.5
            L 39.146484375 64.5
            L 41.146484375 64.5
            L 41.146484375 74.0
            A 1 1 0 0 1 40.146484375 75.0
            L 24.146484375 75.0
            A 1 1 0 0 1 23.146484375 74.0
            L 23.146484375 64.5
            L 25.146484375 64.5
            L 25.146484375 61.5
            L 23.146484375 61.5
            L 23.146484375 58.0
            A 1 1 0 0 1 24.146484375 57.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="32.146484375" y="71.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">B</text>

    <!-- Block Name -->
    <text x="46.146484375" y="71.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">E_RS</text>

    <text x="50.0" y="86.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">3.0</text>

    <!-- Data Ports -->

    <polygon points="93.5,91.0 98.5,96.0 93.5,101.0" fill="#A3B08F"/>
    <text x="90.5" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Q</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="105" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="105" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="110.0" y1="16.0" x2="110.0" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="100" y1="16.0" x2="120" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="100" y1="96.0" x2="120" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Reset output Q – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Set output Q – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="125" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Output Q has changed</text>

    <text x="125" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">BOOL</tspan> – value of flip flop</text>
  </g>
</svg>
