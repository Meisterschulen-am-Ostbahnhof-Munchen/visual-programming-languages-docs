    <rect x="111.244140625" y="71.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="116.244140625" y1="16.0" x2="116.244140625" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="106.244140625" y1="16.0" x2="126.244140625" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="106.244140625" y1="76.0" x2="126.244140625" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
