    <text x="131.244140625" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">BOOL</tspan> – value of flip flop</text>
  </g>
