          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">CLK</text>

    <polygon points="99.744140625,11.0 104.744140625,16.0 99.744140625,21.0" fill="#63B31F"/>
    <text x="96.744140625" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">EO</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 21.0 37.0
            L 37.0 37.0
            A 1 1 0 0 1 38.0 38.0
            L 38.0 41.5
            L 36.0 41.5
            L 36.0 44.5
            L 38.0 44.5
            L 38.0 54.0
            A 1 1 0 0 1 37.0 55.0
            L 21.0 55.0
            A 1 1 0 0 1 20.0 54.0
            L 20.0 44.5
