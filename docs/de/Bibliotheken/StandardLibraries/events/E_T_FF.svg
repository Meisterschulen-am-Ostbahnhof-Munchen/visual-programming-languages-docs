<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 618.84375 112.0"
     width="618.84375" height="112.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(295.8046875, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 103.244140625 0
            A 3 3 0 0 1 106.244140625 3
            L 106.244140625 23.0
            A 3 3 0 0 1 103.244140625 26.0
            L 96.244140625 26.0
            L 96.244140625 66.0
            L 103.244140625 66.0
            A 3 3 0 0 1 106.244140625 69.0
            L 106.244140625 89.0
            A 3 3 0 0 1 103.244140625 92.0
            L 3 92.0
            A 3 3 0 0 1 0 89.0
            L 0 69.0
            A 3 3 0 0 1 3 66.0
            L 10 66.0
            L 10 26.0
            L 3 26.0
            A 3 3 0 0 1 0 23.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
