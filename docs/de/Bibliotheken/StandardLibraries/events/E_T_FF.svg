          fill="#000000" text-anchor="middle">B</text>

    <!-- Block Name -->
    <text x="43.0" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">E_T_FF</text>

    <text x="53.1220703125" y="66.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">3.0</text>

    <!-- Data Ports -->

    <polygon points="99.744140625,71.0 104.744140625,76.0 99.744140625,81.0" fill="#A3B08F"/>
