          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="143.1201171875" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="148.1201171875" y1="36.0" x2="148.1201171875" y2="96.0"
