            L 138.1201171875 43.0
            A 3 3 0 0 1 135.1201171875 46.0
            L 128.1201171875 46.0
            L 128.1201171875 86.0
            L 135.1201171875 86.0
            A 3 3 0 0 1 138.1201171875 89.0
