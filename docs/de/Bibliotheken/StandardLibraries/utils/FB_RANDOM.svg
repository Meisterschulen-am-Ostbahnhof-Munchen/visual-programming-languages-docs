    <polygon points="131.6201171875,31.0 136.6201171875,36.0 131.6201171875,41.0" fill="#63B31F"/>
    <text x="128.6201171875" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
