<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1208.67578125 192.0"
     width="1208.67578125" height="192.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(471.9599609375, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 184.6328125 0
            A 3 3 0 0 1 187.6328125 3
            L 187.6328125 103.0
            A 3 3 0 0 1 184.6328125 106.0
            L 177.6328125 106.0
            L 177.6328125 146.0
            L 184.6328125 146.0
            A 3 3 0 0 1 187.6328125 149.0
            L 187.6328125 169.0
            A 3 3 0 0 1 184.6328125 172.0
            L 3 172.0
            A 3 3 0 0 1 0 169.0
            L 0 149.0
            A 3 3 0 0 1 3 146.0
            L 10 146.0
            L 10 106.0
            L 3 106.0
            A 3 3 0 0 1 0 103.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">START</text>

    <polygon points="1.5,31.0 6.5,36.0 1.5,41.0" fill="#63B31F"/>
    <text x="9.5" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">EXTEND_REQ</text>

    <polygon points="1.5,51.0 6.5,56.0 1.5,61.0" fill="#63B31F"/>
    <text x="9.5" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">RETRACT_REQ</text>

    <polygon points="1.5,71.0 6.5,76.0 1.5,81.0" fill="#63B31F"/>
    <text x="9.5" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">AT_HOME</text>

    <polygon points="1.5,91.0 6.5,96.0 1.5,101.0" fill="#63B31F"/>
    <text x="9.5" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">AT_END</text>

    <polygon points="181.1328125,11.0 186.1328125,16.0 181.1328125,21.0" fill="#63B31F"/>
    <text x="178.1328125" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">INITO</text>

    <polygon points="181.1328125,31.0 186.1328125,36.0 181.1328125,41.0" fill="#63B31F"/>
    <text x="178.1328125" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">EXTEND</text>

    <polygon points="181.1328125,51.0 186.1328125,56.0 181.1328125,61.0" fill="#63B31F"/>
    <text x="178.1328125" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">RETRACT</text>

    <polygon points="181.1328125,71.0 186.1328125,76.0 181.1328125,81.0" fill="#63B31F"/>
    <text x="178.1328125" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">STOP</text>

    <polygon points="181.1328125,91.0 186.1328125,96.0 181.1328125,101.0" fill="#63B31F"/>
    <text x="178.1328125" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">CNF</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 21.0 117.0
            L 37.0 117.0
            A 1 1 0 0 1 38.0 118.0
            L 38.0 121.5
            L 36.0 121.5
            L 36.0 124.5
            L 38.0 124.5
            L 38.0 134.0
            A 1 1 0 0 1 37.0 135.0
            L 21.0 135.0
            A 1 1 0 0 1 20.0 134.0
            L 20.0 124.5
            L 22.0 124.5
            L 22.0 121.5
            L 20.0 121.5
            L 20.0 118.0
            A 1 1 0 0 1 21.0 117.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="29.0" y="131.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">B</text>

    <!-- Block Name -->
    <text x="43.0" y="131.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">EventDrivenCylinder</text>

    <text x="93.81640625" y="146.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">1.0</text>

    <!-- Data Ports -->


    <!-- Event-Data Association Connectors and Lines -->

    <!-- Horizontal Connection Lines -->

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Initialize: go to the idle HOME state and confirm with INITO – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Request the cylinder to extend – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Request the cylinder to retract – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Fired by the home position sensor: the cylinder is fully retracted – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Fired by the end position sensor: the cylinder is fully extended – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="212.6328125" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Initialization confirmed, now in the idle HOME state</text>

    <text x="212.6328125" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Command the actuator to extend</text>

    <text x="212.6328125" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Command the actuator to retract</text>

    <text x="212.6328125" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Fired once at the end of every movement (whichever direction), before CNF</text>

    <text x="212.6328125" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Fired once at the end of every movement, confirming the request is complete</text>
  </g>
</svg>
