<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1521.8037109375 152.0"
     width="1521.8037109375" height="152.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(715.23046875, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 169.9912109375 0
            A 3 3 0 0 1 172.9912109375 3
            L 172.9912109375 63.0
            A 3 3 0 0 1 169.9912109375 66.0
            L 162.9912109375 66.0
            L 162.9912109375 106.0
            L 169.9912109375 106.0
            A 3 3 0 0 1 172.9912109375 109.0
            L 172.9912109375 129.0
            A 3 3 0 0 1 169.9912109375 132.0
            L 3 132.0
            A 3 3 0 0 1 0 129.0
            L 0 109.0
            A 3 3 0 0 1 3 106.0
            L 10 106.0
            L 10 66.0
            L 3 66.0
            A 3 3 0 0 1 0 63.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">TRIGGER</text>

    <polygon points="1.5,31.0 6.5,36.0 1.5,41.0" fill="#63B31F"/>
    <text x="9.5" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">REQ</text>

    <polygon points="166.4912109375,11.0 171.4912109375,16.0 166.4912109375,21.0" fill="#63B31F"/>
    <text x="163.4912109375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">TO_POSITION</text>

    <polygon points="166.4912109375,31.0 171.4912109375,36.0 166.4912109375,41.0" fill="#63B31F"/>
    <text x="163.4912109375" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">STOP</text>

    <polygon points="166.4912109375,51.0 171.4912109375,56.0 166.4912109375,61.0" fill="#63B31F"/>
    <text x="163.4912109375" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">DONE</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 48.45703125 77.0
            L 64.45703125 77.0
            A 1 1 0 0 1 65.45703125 78.0
            L 65.45703125 81.5
            L 63.45703125 81.5
            L 63.45703125 84.5
            L 65.45703125 84.5
            L 65.45703125 94.0
            A 1 1 0 0 1 64.45703125 95.0
            L 48.45703125 95.0
            A 1 1 0 0 1 47.45703125 94.0
            L 47.45703125 84.5
            L 49.45703125 84.5
            L 49.45703125 81.5
            L 47.45703125 81.5
            L 47.45703125 78.0
            A 1 1 0 0 1 48.45703125 77.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="56.45703125" y="91.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">B</text>

    <!-- Block Name -->
    <text x="70.45703125" y="91.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">TrueUntil</text>

    <text x="86.49560546875" y="106.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">1.0</text>

    <!-- Data Ports -->

    <polygon points="1.5,111.0 6.5,116.0 1.5,121.0" fill="#A3B08F"/>
    <text x="9.5" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">inPosition</text>


    <!-- Event-Data Association Connectors and Lines -->

    <!-- Horizontal Connection Lines -->

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Start moving to the position – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Alternate trigger, treated the same as TRIGGER – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="197.9912109375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Command the actuator to move (wire to the concrete actuator's own move-request event)</text>

    <text x="197.9912109375" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Position reached: stop the actuator</text>

    <text x="197.9912109375" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Position reached: notify the chain to continue with the next action</text>

    <text x="-25" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">TRUE once the actuator has reached the position (wire to the concrete actuator's own feedback sensor) – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">BOOL</tspan></text>
  </g>
