  <text x="-5.5" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">Volladapterbasierte Alternative zu F_AI_RAW_TO_PERCENT: Analog-Rohwert (AD-Adapter, DWORD 0-4095) linear in Prozent (AR-Adapter, REAL 0.0-100.0) umrechnen, gleiches Ergebnis wie die datenbasierte Variante. WICHTIG: AD_TO_AR/F_DWORD_TO_REAL waere hier FALSCH - das ist eine Bit-Reinterpretation (IEEE754-Cast), keine numerische Umwandlung (siehe forte_real.cpp CIEC_REAL::setValue, case e_DWORD: setValueSimple). Der korrekte Weg ist AD_TO_AUDI (Bit-Reinterpretation DWORD-UDINT, hier gueltig, gleiche Bitbreite/Darstellung) gefolgt von AUDI_TO_AR (nutzt intern F_UDINT_TO_REAL, echte numerische Umwandlung).</text>
