          fill="#000000" text-anchor="end" dominant-baseline="middle">DOWN</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="105" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="105" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="110.0" y1="16.0" x2="110.0" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <rect x="119" y="31.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="119" y="111.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="124.0" y1="36.0" x2="124.0" y2="116.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="100" y1="16.0" x2="120" y2="16.0"
