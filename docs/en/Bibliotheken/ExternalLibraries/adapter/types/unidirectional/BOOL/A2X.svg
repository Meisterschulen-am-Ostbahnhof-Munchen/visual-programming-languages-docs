<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 529.4951171875 152.0"
     width="529.4951171875" height="152.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(35, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 97 0
            A 3 3 0 0 1 100 3
            L 100 43.0
            A 3 3 0 0 1 97 46.0
            L 90 46.0
            L 90 86.0
            L 97 86.0
            A 3 3 0 0 1 100 89.0
            L 100 129.0
            A 3 3 0 0 1 97 132.0
            L 3 132.0
            A 3 3 0 0 1 0 129.0
            L 0 89.0
            A 3 3 0 0 1 3 86.0
            L 10 86.0
            L 10 46.0
            L 3 46.0
            A 3 3 0 0 1 0 43.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="93.5,11.0 98.5,16.0 93.5,21.0" fill="#63B31F"/>
    <text x="90.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">E_UP</text>

    <polygon points="93.5,31.0 98.5,36.0 93.5,41.0" fill="#63B31F"/>
    <text x="90.5" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">E_DOWN</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 27.32177734375 57.0
            L 43.32177734375 57.0
            A 1 1 0 0 1 44.32177734375 58.0
            L 44.32177734375 61.5
            L 42.32177734375 61.5
            L 42.32177734375 64.5
            L 44.32177734375 64.5
            L 44.32177734375 74.0
            A 1 1 0 0 1 43.32177734375 75.0
            L 27.32177734375 75.0
            A 1 1 0 0 1 26.32177734375 74.0
            L 26.32177734375 64.5
            L 28.32177734375 64.5
            L 28.32177734375 61.5
            L 26.32177734375 61.5
            L 26.32177734375 58.0
