    <line x1="100" y1="36.0" x2="134" y2="36.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="100" y1="96.0" x2="120" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="100" y1="116.0" x2="134" y2="116.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="139" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – UP</text>

    <text x="139" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – DOWN</text>

    <text x="139" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">BOOL</tspan> – TRUE = forward, up, right, clockwise</text>

    <text x="139" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">BOOL</tspan> – TRUE = backward, down, left, counter-clockwise</text>
  </g>
