<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 461.798828125 112.0"
     width="461.798828125" height="112.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(35, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 97 0
            A 3 3 0 0 1 100 3
            L 100 23.0
            A 3 3 0 0 1 97 26.0
            L 90 26.0
            L 90 66.0
            L 97 66.0
            A 3 3 0 0 1 100 69.0
            L 100 89.0
            A 3 3 0 0 1 97 92.0
            L 3 92.0
            A 3 3 0 0 1 0 89.0
            L 0 69.0
            A 3 3 0 0 1 3 66.0
            L 10 66.0
            L 10 26.0
            L 3 26.0
            A 3 3 0 0 1 0 23.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="93.5,11.0 98.5,16.0 93.5,21.0" fill="#63B31F"/>
    <text x="90.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">E1</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 31.23876953125 37.0
            L 47.23876953125 37.0
            A 1 1 0 0 1 48.23876953125 38.0
            L 48.23876953125 41.5
            L 46.23876953125 41.5
            L 46.23876953125 44.5
            L 48.23876953125 44.5
            L 48.23876953125 54.0
            A 1 1 0 0 1 47.23876953125 55.0
            L 31.23876953125 55.0
            A 1 1 0 0 1 30.23876953125 54.0
            L 30.23876953125 44.5
            L 32.23876953125 44.5
            L 32.23876953125 41.5
            L 30.23876953125 41.5
            L 30.23876953125 38.0
            A 1 1 0 0 1 31.23876953125 37.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="39.23876953125" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">S</text>

    <!-- Block Name -->
    <text x="53.23876953125" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">AD</text>

    <text x="50.0" y="66.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">1.0</text>

    <!-- Data Ports -->

    <polygon points="93.5,71.0 98.5,76.0 93.5,81.0" fill="#82A3A9"/>
    <text x="90.5" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">D1</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="105" y="11.0" width="10" height="10"
