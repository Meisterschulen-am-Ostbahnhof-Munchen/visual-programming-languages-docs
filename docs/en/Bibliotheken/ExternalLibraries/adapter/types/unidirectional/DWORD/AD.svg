    <line x1="100" y1="16.0" x2="120" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="100" y1="76.0" x2="120" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="125" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Indication (or Request)</text>

    <text x="125" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">DWORD</tspan> – Indication (or Request) Data from Plug</text>
  </g>
