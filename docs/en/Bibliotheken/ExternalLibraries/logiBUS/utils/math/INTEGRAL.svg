<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1352.62109375 152.0"
     width="1352.62109375" height="152.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(398.8837890625, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 148.765625 0
            A 3 3 0 0 1 151.765625 3
            L 151.765625 43.0
            A 3 3 0 0 1 148.765625 46.0
            L 141.765625 46.0
            L 141.765625 86.0
            L 148.765625 86.0
            A 3 3 0 0 1 151.765625 89.0
            L 151.765625 129.0
            A 3 3 0 0 1 148.765625 132.0
            L 3 132.0
            A 3 3 0 0 1 0 129.0
            L 0 89.0
            A 3 3 0 0 1 3 86.0
            L 10 86.0
            L 10 46.0
            L 3 46.0
            A 3 3 0 0 1 0 43.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">REQ</text>

    <polygon points="1.5,31.0 6.5,36.0 1.5,41.0" fill="#63B31F"/>
    <text x="9.5" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">RESET</text>

    <polygon points="145.265625,11.0 150.265625,16.0 145.265625,21.0" fill="#63B31F"/>
    <text x="142.265625" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">CNF</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 35.0380859375 57.0
            L 51.0380859375 57.0
            A 1 1 0 0 1 52.0380859375 58.0
            L 52.0380859375 61.5
            L 50.0380859375 61.5
            L 50.0380859375 64.5
            L 52.0380859375 64.5
            L 52.0380859375 74.0
            A 1 1 0 0 1 51.0380859375 75.0
            L 35.0380859375 75.0
            A 1 1 0 0 1 34.0380859375 74.0
            L 34.0380859375 64.5
            L 36.0380859375 64.5
            L 36.0380859375 61.5
            L 34.0380859375 61.5
            L 34.0380859375 58.0
            A 1 1 0 0 1 35.0380859375 57.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="43.0380859375" y="71.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">S</text>

    <!-- Block Name -->
    <text x="57.0380859375" y="71.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">INTEGRAL</text>

    <text x="75.8828125" y="86.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">1.0</text>

    <!-- Data Ports -->

    <polygon points="1.5,91.0 6.5,96.0 1.5,101.0" fill="#DBB418"/>
    <text x="9.5" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">IN</text>

    <polygon points="1.5,111.0 6.5,116.0 1.5,121.0" fill="#18519E"/>
    <text x="9.5" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">TM</text>

    <polygon points="145.265625,91.0 150.265625,96.0 145.265625,101.0" fill="#DBB418"/>
    <text x="142.265625" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">OUT</text>

    <polygon points="145.265625,111.0 150.265625,116.0 145.265625,121.0" fill="#A3B08F"/>
    <text x="142.265625" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">OVERFLOW</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="-15" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="-15" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="-10.0" y1="16.0" x2="-10.0" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <rect x="-15" y="111.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="-10.0" y1="16.0" x2="-10.0" y2="116.0"
          stroke="#000000" stroke-width="1"/>

    <rect x="156.765625" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="156.765625" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="161.765625" y1="16.0" x2="161.765625" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <rect x="156.765625" y="111.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="161.765625" y1="16.0" x2="161.765625" y2="116.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="0" y1="16.0" x2="-20" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="0" y1="96.0" x2="-20" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="0" y1="116.0" x2="-20" y2="116.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="151.765625" y1="16.0" x2="171.765625" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="151.765625" y1="96.0" x2="171.765625" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="151.765625" y1="116.0" x2="171.765625" y2="116.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Normal Execution Request – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">TRUE: OUT is set to zero and OVERFLOW to FALSE – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="176.765625" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Execution Confirmation</text>

    <text x="-25" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Input value – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">REAL</tspan></text>

    <text x="-25" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Time since last call in msec – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">DINT</tspan></text>

    <text x="176.765625" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">REAL</tspan> – Value of the integral. This is done by summing all part integrals IN * TM</text>

    <text x="176.765625" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">BOOL</tspan> – TRUE: The value of OUT is out of range of REAL variables. he function is blocked till it is new initialised by input RESET.</text>
  </g>
</svg>
