<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 693.3212890625 132.0"
     width="693.3212890625" height="132.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(358.052734375, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 110.3125 0
            A 3 3 0 0 1 113.3125 3
            L 113.3125 23.0
            A 3 3 0 0 1 110.3125 26.0
            L 103.3125 26.0
            L 103.3125 66.0
            L 110.3125 66.0
            A 3 3 0 0 1 113.3125 69.0
            L 113.3125 109.0
            A 3 3 0 0 1 110.3125 112.0
            L 3 112.0
            A 3 3 0 0 1 0 109.0
            L 0 69.0
            A 3 3 0 0 1 3 66.0
            L 10 66.0
            L 10 26.0
            L 3 26.0
            A 3 3 0 0 1 0 23.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">REQ</text>

    <polygon points="106.8125,11.0 111.8125,16.0 106.8125,21.0" fill="#63B31F"/>
    <text x="103.8125" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">CNF</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 21.0 37.0
            L 37.0 37.0
            A 1 1 0 0 1 38.0 38.0
            L 38.0 41.5
            L 36.0 41.5
            L 36.0 44.5
            L 38.0 44.5
            L 38.0 54.0
            A 1 1 0 0 1 37.0 55.0
            L 21.0 55.0
            A 1 1 0 0 1 20.0 54.0
            L 20.0 44.5
            L 22.0 44.5
            L 22.0 41.5
            L 20.0 41.5
            L 20.0 38.0
            A 1 1 0 0 1 21.0 37.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="29.0" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">S</text>

    <!-- Block Name -->
    <text x="43.0" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">OFFSET</text>

    <text x="56.65625" y="66.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">1.0</text>

    <!-- Data Ports -->

    <polygon points="1.5,71.0 6.5,76.0 1.5,81.0" fill="#18519E"/>
    <text x="9.5" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">IN</text>

    <polygon points="106.8125,71.0 111.8125,76.0 106.8125,81.0" fill="#18519E"/>
    <text x="103.8125" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">OUT</text>

    <polygon points="106.8125,91.0 111.8125,96.0 106.8125,101.0" fill="#18519E"/>
    <text x="103.8125" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">FIRST</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="-15" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="-15" y="71.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="-10.0" y1="16.0" x2="-10.0" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <rect x="118.3125" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="118.3125" y="71.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="123.3125" y1="16.0" x2="123.3125" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <rect x="118.3125" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="123.3125" y1="16.0" x2="123.3125" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="0" y1="16.0" x2="-20" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="0" y1="76.0" x2="-20" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="113.3125" y1="16.0" x2="133.3125" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="113.3125" y1="76.0" x2="133.3125" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="113.3125" y1="96.0" x2="133.3125" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Normal Execution Request – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="138.3125" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Execution Confirmation</text>

    <text x="-25" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Input. First call with a Value >0 will Set FIRST – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">DINT</tspan></text>

    <text x="138.3125" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">DINT</tspan> – IN - FIRST</text>

    <text x="138.3125" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">DINT</tspan> – Set at First Call</text>
  </g>
</svg>
