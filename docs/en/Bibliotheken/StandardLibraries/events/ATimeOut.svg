<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 574.9169921875 132.0"
     width="574.9169921875" height="132.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(210.7109375, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 128.216796875 0
            A 3 3 0 0 1 131.216796875 3
            L 131.216796875 43.0
            A 3 3 0 0 1 128.216796875 46.0
            L 121.216796875 46.0
            L 121.216796875 86.0
            L 128.216796875 86.0
            A 3 3 0 0 1 131.216796875 89.0
            L 131.216796875 109.0
            A 3 3 0 0 1 128.216796875 112.0
            L 3 112.0
            A 3 3 0 0 1 0 109.0
            L 0 89.0
            A 3 3 0 0 1 3 86.0
            L 10 86.0
            L 10 46.0
            L 3 46.0
            A 3 3 0 0 1 0 43.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">TimeOut</text>

    <polygon points="124.716796875,11.0 129.716796875,16.0 124.716796875,21.0" fill="#63B31F"/>
    <text x="121.716796875" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">START</text>

    <polygon points="124.716796875,31.0 129.716796875,36.0 124.716796875,41.0" fill="#63B31F"/>
    <text x="121.716796875" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">STOP</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 26.91015625 57.0
            L 42.91015625 57.0
            A 1 1 0 0 1 43.91015625 58.0
            L 43.91015625 61.5
            L 41.91015625 61.5
            L 41.91015625 64.5
            L 43.91015625 64.5
            L 43.91015625 74.0
            A 1 1 0 0 1 42.91015625 75.0
            L 26.91015625 75.0
            A 1 1 0 0 1 25.91015625 74.0
            L 25.91015625 64.5
            L 27.91015625 64.5
            L 27.91015625 61.5
            L 25.91015625 61.5
            L 25.91015625 58.0
            A 1 1 0 0 1 26.91015625 57.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="34.91015625" y="71.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">S</text>

    <!-- Block Name -->
    <text x="48.91015625" y="71.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">ATimeOut</text>

    <text x="65.6083984375" y="86.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">3.0.1</text>

    <!-- Data Ports -->

    <polygon points="124.716796875,91.0 129.716796875,96.0 124.716796875,101.0" fill="#3366FF"/>
    <text x="121.716796875" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">DT</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="136.216796875" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="136.216796875" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="141.216796875" y1="16.0" x2="141.216796875" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="131.216796875" y1="16.0" x2="151.216796875" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="131.216796875" y1="96.0" x2="151.216796875" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Request from Socket – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="156.216796875" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – start timeout notification</text>

    <text x="156.216796875" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – stop timeout notification</text>

    <text x="156.216796875" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">TIME</tspan> – timeout duration</text>
  </g>
