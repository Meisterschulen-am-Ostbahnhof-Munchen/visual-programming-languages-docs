    <!-- Block Name -->
    <text x="43.0" y="111.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">E_DEMUX</text>

    <text x="61.181640625" y="126.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">3.0</text>

    <!-- Data Ports -->

    <polygon points="1.5,131.0 6.5,136.0 1.5,141.0" fill="#18519E"/>
    <text x="9.5" y="137.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
