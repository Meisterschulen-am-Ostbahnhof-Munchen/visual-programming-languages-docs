            A 1 1 0 0 1 38.0 98.0
            L 38.0 101.5
            L 36.0 101.5
            L 36.0 104.5
            L 38.0 104.5
            L 38.0 114.0
            A 1 1 0 0 1 37.0 115.0
            L 21.0 115.0
            A 1 1 0 0 1 20.0 114.0
            L 20.0 104.5
            L 22.0 104.5
            L 22.0 101.5
            L 20.0 101.5
            L 20.0 98.0
            A 1 1 0 0 1 21.0 97.0
            Z"
