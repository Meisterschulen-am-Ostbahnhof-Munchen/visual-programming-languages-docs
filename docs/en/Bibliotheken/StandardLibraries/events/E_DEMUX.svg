            A 3 3 0 0 1 122.36328125 3
            L 122.36328125 83.0
            A 3 3 0 0 1 119.36328125 86.0
            L 112.36328125 86.0
            L 112.36328125 126.0
            L 119.36328125 126.0
            A 3 3 0 0 1 122.36328125 129.0
            L 122.36328125 149.0
            A 3 3 0 0 1 119.36328125 152.0
            L 3 152.0
            A 3 3 0 0 1 0 149.0
            L 0 129.0
            A 3 3 0 0 1 3 126.0
            L 10 126.0
            L 10 86.0
            L 3 86.0
            A 3 3 0 0 1 0 83.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
