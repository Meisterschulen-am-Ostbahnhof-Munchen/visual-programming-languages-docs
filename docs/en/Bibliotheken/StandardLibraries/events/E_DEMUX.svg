    <text x="147.36328125" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Output, demultiplexed from EI when K=2</text>

    <text x="147.36328125" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
