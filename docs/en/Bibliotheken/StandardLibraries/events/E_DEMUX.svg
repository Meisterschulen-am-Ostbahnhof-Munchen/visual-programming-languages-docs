    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">EI</text>

    <polygon points="115.86328125,11.0 120.86328125,16.0 115.86328125,21.0" fill="#63B31F"/>
    <text x="112.86328125" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">EO0</text>

    <polygon points="115.86328125,31.0 120.86328125,36.0 115.86328125,41.0" fill="#63B31F"/>
    <text x="112.86328125" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">EO1</text>

    <polygon points="115.86328125,51.0 120.86328125,56.0 115.86328125,61.0" fill="#63B31F"/>
