    <line x1="0" y1="16.0" x2="-20" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="0" y1="136.0" x2="-20" y2="136.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Event to demultiplex – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="147.36328125" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Output, demultiplexed from EI when K=0</text>

    <text x="147.36328125" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
