          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Event Output</text>

    <text x="204.716796875" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
