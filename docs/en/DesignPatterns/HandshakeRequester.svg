    <text x="216.1396484375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Initialization Confirm</text>

    <text x="216.1396484375" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
